name: Flutter CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/flutter-pipeline.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.0'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/subin-frontend

jobs:
  # ────────────────────────────────────────────────
  # 1. ANALYZE
  # ────────────────────────────────────────────────
  analyze:
    name: Analyze (flutter analyze + format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze --fatal-infos

  # ────────────────────────────────────────────────
  # 2. TEST (unit + Riverpod widget tests)
  # ────────────────────────────────────────────────
  test:
    name: Test (unit + widget)
    runs-on: ubuntu-latest
    needs: analyze
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage --reporter=github

      - uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  # ────────────────────────────────────────────────
  # 3. BUILD (release web build) + SENTRY RELEASE
  # ────────────────────────────────────────────────
  build:
    name: Build release + create Sentry release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: frontend
    outputs:
      release_version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - id: version
        run: echo "version=subin-flutter@${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build release web bundle
        run: |
          flutter build web --release \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=API_BASE_URL=${{ vars.PROD_API_BASE_URL }} \
            --dart-define=ENVIRONMENT=production \
            --source-maps

      - name: Create Sentry release & upload source maps
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_FLUTTER }}
        with:
          environment: production
          version: ${{ steps.version.outputs.version }}
          sourcemaps: frontend/build/web
          url_prefix: '~/'

      - uses: actions/upload-artifact@v4
        with:
          name: subin-web-build
          path: frontend/build/web
          retention-days: 14

  # ────────────────────────────────────────────────
  # 4. BUILD & PUSH DOCKER IMAGE (web, served via Nginx)
  # ────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }} 
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            SENTRY_RELEASE=${{ needs.build.outputs.release_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ────────────────────────────────────────────────
  # 5. DEPLOY (trigger Coolify webhook, main only)
  # ────────────────────────────────────────────────
  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Trigger Coolify deployment webhook
        run: |
          curl --fail-with-body -sS -X GET \
            "${{ secrets.COOLIFY_FRONTEND_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"

      - name: Summary
        run: |
          echo "### Frontend deployed :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`${{ needs.build-and-push.outputs.image }}\`" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────
