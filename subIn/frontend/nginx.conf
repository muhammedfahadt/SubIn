server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 1. GZIP COMPRESSION (Crucial for Flutter's large JS/Wasm files)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        font/woff2;

    # 2. SPA ROUTING FALLBACK (Prevents 404s on browser refresh)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 3. AGGRESSIVE CACHING FOR IMMUTABLE ASSETS
    location ~* \.(js|css|wasm|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 4. STRICT NO-CACHE FOR INDEX.HTML (Forces version updates)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";   
    }
    location = /flutter_bootstrap.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
}
}
