name: sub_in
description: Sports matchmaking platform - find venues, players, teams, and events

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^2.0.0
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.0
  shimmer: ^4.0.0
  lottie: ^3.1.0

  # State Management
  flutter_riverpod: ^3.4.3

  # HTTP & API
  dio: ^5.4.0
  retrofit: ^4.10.0
  json_annotation: ^4.9.0
  # Location & Maps (100% free - OpenStreetMap, no API key)
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Auth
  flutter_secure_storage: ^10.3.4
  go_router: ^18.0.2

  # Utils
  intl: ^0.20.2
  cached_network_image: ^4.0.3
  image_picker: ^1.0.7
  url_launcher: ^6.2.5
  share_plus: ^7.2.2

  # Date/Time
  flutter_datetime_picker_plus: ^2.1.0
  shared_preferences: ^2.5.5
  sentry_flutter: ^8.14.2
  talker_flutter: ^4.1.2
  talker: ^4.1.2
  talker_dio_logger: ^4.9.3
  freezed_annotation: ^3.1.0
  google_maps_flutter: ^2.18.1

dependency_overrides:
  talker: 4.1.2
  talker_flutter: 4.1.2
  talker_dio_logger: 4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3
  build_runner: ^2.5.4
  retrofit_generator: ^10.0.0
  json_serializable: ^6.14.1
  flutter_lints: ^6.0.0
  freezed: ^3.0.0  

flutter:
  uses-material-design: true

  #assets:
    #- assets/images/
    #- assets/animations/
    #- assets/icons/
