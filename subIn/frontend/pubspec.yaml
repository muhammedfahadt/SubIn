name: subIn
description: Sports matchmaking platform - find venues, players, teams, and events

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.1.0

  # State Management
  flutter_riverpod: ^2.5.1

  # HTTP & API
  dio: ^5.4.0
  retrofit: ^4.1.0

  # Location & Maps
  google_maps_flutter: ^2.6.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Auth
  flutter_secure_storage: ^9.0.0
  go_router: ^17.5.0

  # Utils
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  url_launcher: ^6.2.5
  share_plus: ^7.2.2

  # Date/Time
  flutter_datetime_picker_plus: ^2.1.0
  shared_preferences: ^2.5.5
  sentry_flutter: ^8.14.2
  talker_flutter: ^4.1.2
  talker: ^4.1.2
  talker_dio_logger: ^4.9.3

dependency_overrides:
  talker: 4.1.2
  talker_flutter: 4.1.2
  talker_dio_logger: 4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  retrofit_generator: ^8.1.0
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  #assets:
    #- assets/images/
    #- assets/animations/
    #- assets/icons/
